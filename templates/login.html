{% extends "base.html" %}
{% block title %}Sign In · Todo App{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl shadow-black/20">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-slate-400 text-sm mt-2">Sign in to continue to your tasks</p>
    </div>

    {% if errors %}
      <div class="mb-6 rounded-xl bg-rose-500/10 border border-rose-500/20 px-4 py-3 text-sm text-rose-300">
        <ul class="list-disc list-inside space-y-1">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-5" novalidate>
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <div>
        <label for="email" class="block text-sm text-slate-400 mb-1.5">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="you@example.com"
        >
      </div>

      <div>
        <label for="password" class="block text-sm text-slate-400 mb-1.5">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="••••••••"
        >
      </div>

      <div class="flex items-center gap-2">
        <input
          id="remember"
          name="remember"
          value="1"
          type="checkbox"
          class="h-4 w-4 rounded border-slate-600 bg-slate-800 text-brand focus:ring-brand"
        >
        <label for="remember" class="text-sm text-slate-400">Remember Me</label>
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-brand hover:bg-sky-400 text-slate-900 font-semibold py-3 transition active:scale-[0.98]"
      >
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-400">
      Don’t have an account?
      <a href="{{ url_for('register') }}" class="text-brand hover:underline">Create one</a>
    </p>
  </div>
</section>
{% endblock %}
