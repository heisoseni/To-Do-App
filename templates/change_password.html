{% extends "base.html" %}
{% block title %}Change Password · Todo App{% endblock %}

{% block content %}
<section class="mx-auto max-w-md">
  <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-xl shadow-black/20">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold">Change Password</h1>
      <p class="text-slate-400 text-sm mt-2">Update your account password</p>
    </div>

    {% if errors %}
      <div class="mb-6 rounded-xl bg-rose-500/10 border border-rose-500/20 px-4 py-3 text-sm text-rose-300">
        <ul class="list-disc list-inside space-y-1">
          {% for error in errors %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}" class="space-y-5">
      <div>
        <label for="current_password" class="block text-sm text-slate-400 mb-1.5">Current Password</label>
        <input
          id="current_password"
          name="current_password"
          type="password"
          required
          class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="••••••••"
        >
      </div>

      <div>
        <label for="new_password" class="block text-sm text-slate-400 mb-1.5">New Password</label>
        <input
          id="new_password"
          name="new_password"
          type="password"
          required
          minlength="8"
          class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="••••••••"
        >
      </div>

      <div>
        <label for="confirm_password" class="block text-sm text-slate-400 mb-1.5">Confirm New Password</label>
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          required
          minlength="8"
          class="w-full rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition"
          placeholder="••••••••"
        >
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-brand hover:bg-sky-400 text-slate-900 font-semibold py-3 transition active:scale-[0.98]"
      >
        Update Password
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a href="{{ url_for('dashboard') }}" class="text-slate-400 hover:text-white transition">
        ← Back to Dashboard
      </a>
    </p>
  </div>
</section>
{% endblock %}
